<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The address bar and the pull-down surfaces on a phone are painted by the
     browser, not by styles.css, so a near-black page sat under a white bar.
     These two are the same values as --bg in each of the stylesheet's palettes. -->
<meta name="theme-color" content="#0a1211" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6faf9" media="(prefers-color-scheme: light)">
<title>Confirm your email — Repple</title>
  <link rel="canonical" href="https://www.repplefitness.com/confirmed">
  <meta name="description" content="Your email address is confirmed. Open the Repple app and sign in.">
<meta name="robots" content="noindex">
<!-- The card a link to this page unfurls as, in a message, a Slack channel or a
     search result. Every page on this site shipped without one. -->
<meta property="og:title" content="Email confirmed — Repple">
<meta property="og:description" content="Your email address is confirmed. Sign in to the app that matches your role.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Repple">
<meta property="og:image" content="https://www.repplefitness.com/og/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Repple mark beside the words “Repple — the operating record for gyms, coaches and the people they train.”">
<meta name="twitter:card" content="summary_large_image">
<!-- styles.css @imports its three families from Google Fonts. Without these,
     the browser cannot start that request until it has downloaded and parsed
     the stylesheet: DNS, TCP and TLS to two hosts all sit on the critical path
     for the first paint of text. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=a54c9215fb">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
/* The phone header. Links collapse behind one button; without JavaScript they
   simply stay in the bar and wrap, which is why the collapsed state is gated on
   the js-nav class rather than being the default. */
document.documentElement.classList.add('js-nav');
addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('nav.site');
  var btn = nav && nav.querySelector('.nav-toggle');
  if (!btn) return;
  /* Closing the menu takes its links OUT OF THE RENDER TREE — `.nav-links` goes
     back to display:none below 760px — so when focus is on one of them at the
     moment this runs, focus lands on the document body and a keyboard user is nowhere,
     with no way back but Tab from the top of the document.

     All three ways in reach it while a link can be focused: Escape (the exact
     key a disclosure is supposed to be closed with), a click outside, and
     `resize` — which on a phone fires when the URL bar collapses or the
     on-screen keyboard opens, i.e. with no gesture from the user at all.

     So focus goes back to the button that opened the menu, which is where a
     disclosure is required to return it. Only when focus was actually inside:
     moving focus that was somewhere else entirely would be a worse bug than
     the one being fixed. */
  var menu = nav.querySelector('#site-menu');
  function shut() {
    var wasInside = nav.classList.contains('open') && menu
      && menu.contains(document.activeElement);
    nav.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', 'Open menu');
    if (wasInside) btn.focus();
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target)) shut(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(); });
  addEventListener('resize', shut);
});
</script>
</head>
<body>

<!-- The header carries six links before the content starts. Without this a
     keyboard or switch user tabs all six on every page of the site. -->
<a class="skip" href="#main">Skip to content</a>

<!--
  WHERE A CONFIRMATION LINK LANDS.

  Before this page existed, signUp() was called with no emailRedirectTo, so the
  link fell back to the project's Site URL — the marketing homepage, which has
  no token handling and says nothing about accounts. Supabase's /auth/v1/verify
  endpoint does confirm the address before redirecting, so the click worked;
  the person just had no way to know it had. They were left on a sales page
  wondering whether to try again.

  This page says what happened, and distinguishes the three outcomes rather
  than assuming success: confirmed, link already used or expired, and arrived
  here with no token at all.
-->

<main id="main" tabindex="-1">
  <div class="wrap page" style="max-width:620px">
    <p class="eyebrow">Repple</p>
    <!-- The heading and the lede are the whole content of this page: which of
         the six outcomes happened. Both were rewritten by script with nothing
         announcing it, so a screen reader read "Confirming your email… One
         moment." on load and was never told the answer arrived. Wrapping the
         pair in a polite status region means every one of the six — expired,
         already confirmed, failed, press-to-confirm, confirmed, nothing to
         confirm — is spoken when it is written. `aria-atomic` because the
         heading and the sentence under it are one message; announcing the
         changed half alone would say "That link has expired" without the
         remedy, or the remedy without what went wrong. -->
    <div id="report" role="status" aria-live="polite" aria-atomic="true">
      <h1 class="display" id="head" tabindex="-1">Confirming your email…</h1>
      <p class="lede" id="body">One moment.</p>
    </div>

    <div id="actions" hidden>
      <p class="btn-row">
        <a class="btn primary" href="/download">Get the app</a>
        <a class="btn" href="/">Back to the site</a>
      </p>
    </div>

    <div id="retry" hidden>
      <p class="btn-row">
        <a class="btn primary" href="/signup">Try signing up again</a>
        <a class="btn" href="mailto:support@repplefitness.com?subject=Confirmation%20link">Email support</a>
      </p>
    </div>

    <div id="confirm" hidden>
      <p class="btn-row">
        <button class="btn primary" type="button" id="go">Confirm my email</button>
      </p>
    </div>
  </div>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // detectSessionInUrl off: this page reads the URL itself and must not have a
  // session created behind its back. persistSession off: confirming an address
  // is not signing in, and this may well be a borrowed or public computer —
  // nothing should be left in its storage afterwards.
  const sb = createClient(
    'https://phgfwzpkkwdysftlgkoq.supabase.co',
    'sb_publishable_Td-L1IVNMzPpQsa30hUExQ_K--w76RZ',
    { auth: { detectSessionInUrl: false, persistSession: false } },
  );

  const $ = (id) => document.getElementById(id);
  const head = $('head'), body = $('body');
  const panels = { actions: $('actions'), retry: $('retry'), confirm: $('confirm') };
  const go = $('go');

  /* `focus` is passed only when say() is answering something the reader just
     did. Pressing "Confirm my email" HIDES the panel that button lives in, so
     without this focus falls to <body> at the exact moment the page finally
     has something to say, and the two links that replace the button are only
     reachable by tabbing from the top of the document. Focus moves to the
     heading BEFORE the panel is hidden, so it is never taken off an element
     that is being removed. On first load nothing is passed: focus stays where
     the browser put it and the status region above does the talking. */
  const say = (h, b, panel, focus) => {
    head.textContent = h;
    body.innerHTML = b;
    if (focus) head.focus();
    for (const [k, el] of Object.entries(panels)) el.hidden = k !== panel;
  };

  const q = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));

  const err = hash.get('error') || q.get('error');
  const errDesc = hash.get('error_description') || q.get('error_description');
  const tokenHash = q.get('token_hash');

  // Supabase's own email types, so a link for one flow is not verified as
  // another. Anything unrecognised falls back to the one this page is for.
  const TYPES = ['signup', 'email', 'email_change', 'invite', 'magiclink'];
  const linkType = TYPES.includes(q.get('type')) ? q.get('type') : 'signup';

  if (err) {
    // Almost always an expired or already-used link. Say which, because the
    // remedy differs: expired needs a new email, already-used needs nothing.
    const d = (errDesc || '').replace(/\+/g, ' ');
    if (/expired/i.test(d)) {
      say('That link has expired',
          'Confirmation links do not last forever. Sign up again with the same address and we will send a fresh one &mdash; nothing you did is lost.', 'retry');
    } else if (/already|used/i.test(d)) {
      say('Already confirmed',
          'This address is confirmed and the link has been used. You can sign in from the app.', 'actions');
    } else {
      say('That link did not work', d || 'The link could not be verified. Sign up again and we will send a new one.', 'retry');
    }

  } else if (tokenHash) {
    // NOT verified on load, and this is the whole point of the page.
    //
    // A confirmation token can be spent once. Mail filters — Microsoft Safe
    // Links, Gmail's scanner, anything a company puts in front of a mailbox —
    // spend it by fetching the URL before its owner ever sees the message. The
    // person then clicks a dead link and is told it expired. That is what
    // happened to a real signup in August, and it is why the toggle for email
    // confirmation is currently off.
    //
    // Scanners fetch. They do not run scripts and they do not press buttons.
    // So the token waits here for a press.
    say('Confirm your email',
        'One press and your Repple account is ready to sign in to.', 'confirm');

    /* `disabled` rather than aria-disabled would drop focus to <body> the
       instant it is set, for the whole length of a network call, and then
       hand it back to an element the reader is no longer standing on. The
       button stays focusable and says it is busy; `busy` is what actually
       stops a second press. */
    let busy = false;
    go.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      go.setAttribute('aria-disabled', 'true');
      go.textContent = 'Confirming\u2026';
      const { error } = await sb.auth.verifyOtp({ type: linkType, token_hash: tokenHash });
      if (error) {
        busy = false;
        go.removeAttribute('aria-disabled');
        go.textContent = 'Confirm my email';
        say('That link did not work',
            `${error.message}. Confirmation links can be used once and they expire, so this one has most likely already been used or has run out &mdash; sign up again with the same address for a fresh one.`, 'retry', true);
        return;
      }
      say('Email confirmed',
          'Your address is confirmed and your account is ready. Sign in from the app with the email and password you chose.', 'actions', true);
    });

  } else if (hash.get('access_token')) {
    // The older link shape: /auth/v1/verify confirmed the address server-side
    // and redirected here with tokens already in the fragment. Nothing left to
    // do, and saying "confirmed" is true for this shape — which it was NOT for
    // token_hash, where this page used to claim success having verified
    // nothing at all.
    say('Email confirmed',
        'Your address is confirmed and your account is ready. Sign in from the app with the email and password you chose.', 'actions');

  } else {
    // No token of any kind: somebody navigated here directly.
    say('Nothing to confirm here',
        'This page is where a confirmation link lands. If you are waiting on one, check your spam and junk folders &mdash; that is usually where it is. If it never arrives, email <a href="mailto:support@repplefitness.com">support@repplefitness.com</a> and we will confirm you by hand.', 'retry');
  }
</script>

</body>
</html>
