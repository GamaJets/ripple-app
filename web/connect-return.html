     browser, not by styles.css, so a near-black page sat under a white bar.
     These two are the same values as --bg in each of the stylesheet's palettes. -->
<meta name="theme-color" content="#0a1211" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6faf9" media="(prefers-color-scheme: light)">
<title>Payouts set up — Repple</title>
  <link rel="canonical" href="https://www.repplefitness.com/connect-return">
  <meta name="description" content="You have finished setting up payouts with Stripe. Open the Repple Coach app to carry on.">
<meta name="robots" content="noindex">
<!-- The card a link to this page unfurls as, in a message, a Slack channel or a
     search result. Every page on this site shipped without one. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Repple">
<meta property="og:image" content="https://www.repplefitness.com/og/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Repple mark beside the words “Repple — the operating record for gyms, coaches and the people they train.”">
<meta name="twitter:card" content="summary_large_image">
<!-- styles.css @imports its three families from Google Fonts. Without these,
     the browser cannot start that request until it has downloaded and parsed
     the stylesheet: DNS, TCP and TLS to two hosts all sit on the critical path
     for the first paint of text. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=d84a82bb66">

<body>

<!-- No skip link here, and that is deliberate rather than an omission. Every
     other page has a sticky header carrying six links and a menu button before
     the content starts, which is what there is to skip. This page has none: it
     is the main landmark and nothing else, so a skip link would be the first
     tab stop on the page, it would announce "Skip to content", and it would
     move focus to the element focus was already about to reach. -->

<!-- The header carries six links before the content starts. Without this a
     keyboard or switch user tabs all six on every page of the site. -->

<!--
  WHERE STRIPE SENDS A COACH WHEN THEY FINISH ONBOARDING.

  This page exists because of one line in Stripe's account-links documentation:
  `return_url` and `refresh_url` "can only use HTTPS in live mode". The app was
  passing `Linking.createURL('connect/return')`, which is a CUSTOM SCHEME —
  `repplecoach://connect/return`. That is neither http nor https, so it works in
  test and is refused the moment Connect goes live.

  Nobody had hit it because live Connect had never run. It would have surfaced
  as the very first coach failing to onboard, at the point where they are
  handing Stripe their passport and their bank details, which is the worst
  possible moment for the flow to break.

  ── Why this page barely does anything ────────────────────────────────────

  Reaching `return_url` does NOT mean onboarding succeeded. Stripe is explicit
  that it redirects here whenever the coach finishes the hosted flow OR leaves
  it, and that the only truthful way to know the outcome is to ask the API for
  the account's requirements. So this page must not congratulate anybody. It
  says the coach is back, sends them into the app, and lets the app read the
  real state from `charges_enabled` — which is what the payouts screen already
  does, and what `account.updated` keeps current.

  The deep link is attempted automatically and also offered as a button,
  because a custom scheme silently does nothing when the app is not installed
  and a page that appears to hang is worse than one with a button on it.
-->

<main id="main" tabindex="-1">
  <div class="wrap page" style="max-width:620px">
    <p class="eyebrow">Repple</p>
    <h1 class="display">You're back from Stripe</h1>
    <p class="lede">
      Open the Repple Coach app to carry on. It will show whether Stripe has
      everything it needs — sometimes they ask for one more document, and the
      app is where that appears.
    </p>

    <p class="btn-row">
      <a class="btn primary" id="open" href="repplecoach://connect/return">Open the app</a>
      <a class="btn" href="/download">Get the app</a>
    </p>
  </div>
</main>

<script>
  /* Deferred, once, and cancellable — the same three guards join.html uses on
     its own bounce, and for the same reason plus one.

     This fired at parse time. On a phone with the app installed the OS takes
     the click and the tab goes away before a screen reader has read the heading
     or the sentence under it, so the one page whose whole job is to explain
     what just happened at Stripe explains it to nobody. It also cannot be
     stopped: somebody who reached for "Get the app" instead was taken to the
     scheme anyway.

     900ms is long enough for the heading and the first line to be spoken and
     short enough that a reader who wants the app is not left waiting. Any
     pointer, key or touch cancels it, because somebody reaching for this page
     is not somebody who wants to be taken off it. The session mark stops a
     Back navigation bouncing straight out again. A desktop browser has no
     handler for the scheme, so nothing happens there either way — the button
     was always the real route and still is. */
  (function () {
    var KEY = 'repple.connect.bounced';
    var gone = false;
    try { gone = sessionStorage.getItem(KEY) === '1'; } catch (e) { gone = false; }
    if (gone) return;
    var cancelled = false;
    var stop = function () { cancelled = true; };
    ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
      addEventListener(ev, stop, { once: true, passive: true });
    });
    setTimeout(function () {
      if (cancelled) return;
      var a = document.getElementById('open');
      if (!a) return;
      try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* private mode */ }
      try { location.href = a.href; } catch (e) { /* the button is the fallback */ }
    }, 900);
  }());
</script>

</body>
</html>
