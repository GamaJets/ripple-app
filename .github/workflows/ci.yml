# Every push and every pull request runs the checks that already pass locally.
#
# The point is not to add new rules. tsc is clean, both test suites pass and
# supabase/setup.sql is in sync — the point is that nothing quietly stops being
# true. Today's session found the concatenated setup.sql had gone stale because
# a migration was added without rebuilding it; `npm run db:check` catches that
# in seconds and nobody had been running it.
#
# Deliberately NOT here: EAS builds and anything needing credentials. Those cost
# money per run and need secrets this workflow has no business holding.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first — no point finishing a run
# whose commit has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · typecheck, tests, schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22 is the current LTS and what Expo SDK 54 supports. Local
          # development happens on 26; if the two ever disagree, this is the
          # version that decides, because it is the one nobody can skip.
          node-version: '26'
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and package-lock.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Compiles the suites and runs both. 337 assertions across the pure
      # libraries — money, payroll, attendance, passes, the CSV importer.
      - name: Tests
        run: npm test

      # supabase/setup.sql is generated by concatenating supabase/parts/*.sql.
      # It is committed so the database can be built from one file, which means
      # it can go stale the moment someone adds a part and forgets to rebuild.
      - name: Schema is in sync
        run: npm run db:check

      # Three times now a native module has gone missing without failing
      # anything: expo-video absent from a store build so clips never played,
      # HealthKit writes refused for want of a usage string, Face ID shipping
      # the library's own "Allow $(PRODUCT_NAME) to use Face ID". None of it
      # fails a typecheck, a test or a bundle — the JavaScript is correct and
      # the binary is wrong. This is the only step that looks.
      - name: Native modules and their permission strings
        run: npm run check:native

      # Preflight has eight steps and this workflow ran four of them. The four
      # below are the ones that caught the worst of a long session's bugs, and
      # not one of them was running on push.

      # Every Supabase read must inspect `error`, or say in a comment why an
      # empty answer is honest without it. The bug this exists for is a refused
      # read rendering as "you have no clients" / "nothing logged" / "no coach
      # assigned" — a statement about the person rather than about the network,
      # and the most expensive sentence any of these screens can say.
      - name: Reads can tell failure from emptiness
        run: npm run check:reads

      # The console imports src/lib from the phone app. A module that reaches
      # for react-native, AsyncStorage or expo-* compiles fine here and dies at
      # runtime in the browser, because those globals do not exist. This is the
      # only step that looks at that boundary.
      - name: Console imports nothing phone-only
        run: npm run check:portal

      # The trainer-profile provider loads the SIGNED-IN user's own rows. Read
      # from a client screen it returns the reader — which is how a client came
      # to see their own name and their own face under "Your coach", their own
      # name written permanently into their real calendar by an ICS export, and
      # their own name interpolated into a push notification delivered to other
      # people. The provider refuses to answer off the coach build now; this is
      # what stops the next person importing it and reasonably assuming it names
      # a client's coach.
      - name: Trainer profile is not read where it cannot answer
        run: npm run check:trainer-profile

      # Three bugs shipped that no typecheck, test or bundle could catch, and
      # every one of them compiled perfectly: two modals visible at once (iOS
      # silently refuses the second, so "Cook mode" was a dead button); a
      # require of a package that was never installed (Metro treats a require in
      # a try/catch as OPTIONAL, so the PDF export was absent from every build
      # ever made); and an env var read in a form Expo's Babel plugin cannot
      # inline (the Spotify client id was configured everywhere and empty in the
      # bundle, and the app blamed the owner for it). This is the step that
      # would have caught each one.
      - name: Runtime traps a compiler cannot see
        run: npm run check:traps

      # Both directions of schema drift. PostgREST rejects the WHOLE statement
      # for one unknown column, so a column the app writes and the database
      # lacks loses every other field on the row too — silently, inside a
      # debounced effect. Five columns existed in production that no file in
      # this repo created, and nothing noticed, because the old check kept a
      # hand-written list of ten tables that did not include `clients`.
      #
      # The offline form compares the app against supabase/setup.sql and needs
      # no credentials. Probing the live database is the other half and belongs
      # in a job that holds a key; this one deliberately holds none.
      - name: Schema drift, app against repo
        run: npm run check:schema:offline

      # Metro resolves differently from tsc. A path case-wrong on a
      # case-sensitive filesystem, a circular import, an asset that is not
      # where the bundler thinks — none of it fails a typecheck or a test, and
      # all of it fails a build. Slowest step here and the last line of defence
      # before a build is cut.
      - name: Bundles for both platforms
        run: npm run check:bundle

  studio_web:
    name: Studio web console · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: studio-web/package-lock.json

      # The console reads src/lib from the parent directory via
      # experimental.externalDir, so a change to a shared library can break the
      # web build while leaving the app perfectly fine. That is exactly the
      # failure this job exists to catch.
      - name: Install
        working-directory: studio-web
        run: npm ci

      # Next prerenders every page at build time, including 'use client'
      # ones, and lib/supabase.ts throws at import when the keys are absent —
      # deliberately, so a missing key never becomes a mystery 401 at runtime.
      # That guard fires in CI, where there are no keys and should not be any.
      #
      # These placeholders are not credentials and are not a way of smuggling
      # one in. Effects do not run during prerender, so nothing here ever
      # opens a connection; the values exist only to get past the import
      # guard so the build can typecheck and render. The URL uses .invalid,
      # the TLD RFC 2606 reserves as permanently unresolvable, so a mistake
      # that did try to reach the network could never land on a real host.
      #
      # A real deploy sets real keys and is unaffected: nothing here is
      # committed to the app, and a deploy that forgot them still fails at
      # import exactly as before.
      - name: Build
        working-directory: studio-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
        run: npm run build
