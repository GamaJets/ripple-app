# Every push and every pull request runs the checks that already pass locally.
#
# The point is not to add new rules. tsc is clean, both test suites pass and
# supabase/setup.sql is in sync — the point is that nothing quietly stops being
# true. Today's session found the concatenated setup.sql had gone stale because
# a migration was added without rebuilding it; `npm run db:check` catches that
# in seconds and nobody had been running it.
#
# ── This file no longer decides which gates exist ──────────────────────────
#
# It used to. It ran ten of them, preflight ran seventeen and
# scripts/publish.sh ran fifteen, and the three lists were different in both
# directions: check:reachable and check:caps ran only at publish, so a branch
# could sit green here for a week carrying a screen nothing linked to;
# check:attribution — the gate on a licence condition — ran only in preflight,
# which is the one entry point a person can forget to type; and check:prose and
# check:decimals ran in none of the three, despite both scripts existing and
# both having been written after a real report. Nobody decided any of that.
# Each list grew by whoever added a check and happened to have that file open.
#
# So there is one list, `check:all` in package.json, and all three entry points
# run it. Read the `//check:all` note beside it before changing anything here:
# adding a step to this file instead of to that list recreates exactly the drift
# it was written to end.
#
# Deliberately NOT here: EAS builds and anything needing credentials. Those cost
# money per run and need secrets this workflow has no business holding. That is
# the ONE thing `check:all` cannot contain and it is why `check:schema` has a
# `--offline` form: preflight and publish probe the live database, this workflow
# holds no key and compares the app against supabase/setup.sql instead, which is
# already inside check:all.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first — no point finishing a run
# whose commit has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · typecheck, tests, gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22 is the current LTS and what Expo SDK 54 supports. Local
          # development happens on 26; if the two ever disagree, this is the
          # version that decides, because it is the one nobody can skip.
          node-version: '26'
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and package-lock.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Compiles the suites and runs both. 337 assertions across the pure
      # libraries — money, payroll, attendance, passes, the CSV importer.
      - name: Tests
        run: npm test

      # Every gate, from the one list. What each of them is for is written at
      # the top of its own script and none of it is repeated here, because a
      # summary in a second file is the thing that goes stale. The ones this
      # workflow used to name, kept as a roll-call of what is now guaranteed to
      # run on every push:
      #
      #   db:check              setup.sql regenerated from supabase/parts/
      #   check:native          native modules and their iOS permission strings
      #   check:reads           a Supabase read can tell failure from emptiness
      #   check:portal          the console imports nothing phone-only
      #   check:trainer-profile the coach provider is not read where it lies
      #   check:traps           runtime traps a compiler cannot see
      #   check:schema:offline  schema drift, app against repo
      #   check:bundle          Metro resolves it for both platforms
      #
      # and the six that were NOT running here before this step existed:
      #
      #   check:attribution     the RepDB credit the licence requires
      #   check:deltas          a movement of zero is not signed
      #   check:reachable       no screen exists that nothing links to
      #   check:caps            sibling labels are capitalised the same way
      #   check:prose           no sentence starts with a missing value
      #   check:decimals        a field holding 16.5 has a decimal point on it
      #
      # One step rather than fourteen: the list belongs in package.json, and a
      # failure prints the failing script's own name and its own explanation.
      # `check:bundle` is last inside it and is by far the slowest — a red X
      # here that took ten minutes is almost always that one.
      - name: Gates
        run: npm run check:all

  studio_web:
    name: Studio web console · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: studio-web/package-lock.json

      # The console reads src/lib from the parent directory via
      # experimental.externalDir, so a change to a shared library can break the
      # web build while leaving the app perfectly fine. That is exactly the
      # failure this job exists to catch.
      - name: Install
        working-directory: studio-web
        run: npm ci

      # Next prerenders every page at build time, including 'use client'
      # ones, and lib/supabase.ts throws at import when the keys are absent —
      # deliberately, so a missing key never becomes a mystery 401 at runtime.
      # That guard fires in CI, where there are no keys and should not be any.
      #
      # These placeholders are not credentials and are not a way of smuggling
      # one in. Effects do not run during prerender, so nothing here ever
      # opens a connection; the values exist only to get past the import
      # guard so the build can typecheck and render. The URL uses .invalid,
      # the TLD RFC 2606 reserves as permanently unresolvable, so a mistake
      # that did try to reach the network could never land on a real host.
      #
      # A real deploy sets real keys and is unaffected: nothing here is
      # committed to the app, and a deploy that forgot them still fails at
      # import exactly as before.
      - name: Build
        working-directory: studio-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
        run: npm run build
