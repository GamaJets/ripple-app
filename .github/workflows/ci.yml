# Every push and every pull request runs the checks that already pass locally.
#
# The point is not to add new rules. tsc is clean, both test suites pass and
# supabase/setup.sql is in sync — the point is that nothing quietly stops being
# true. Today's session found the concatenated setup.sql had gone stale because
# a migration was added without rebuilding it; `npm run db:check` catches that
# in seconds and nobody had been running it.
#
# Deliberately NOT here: EAS builds and anything needing credentials. Those cost
# money per run and need secrets this workflow has no business holding.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first — no point finishing a run
# whose commit has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · typecheck, tests, schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22 is the current LTS and what Expo SDK 54 supports. Local
          # development happens on 26; if the two ever disagree, this is the
          # version that decides, because it is the one nobody can skip.
          node-version: '24'
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and package-lock.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Compiles the suites and runs both. 337 assertions across the pure
      # libraries — money, payroll, attendance, passes, the CSV importer.
      - name: Tests
        run: npm test

      # supabase/setup.sql is generated by concatenating supabase/parts/*.sql.
      # It is committed so the database can be built from one file, which means
      # it can go stale the moment someone adds a part and forgets to rebuild.
      - name: Schema is in sync
        run: npm run db:check

  studio_web:
    name: Studio web console · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio-web/package-lock.json

      # The console reads src/lib from the parent directory via
      # experimental.externalDir, so a change to a shared library can break the
      # web build while leaving the app perfectly fine. That is exactly the
      # failure this job exists to catch.
      - name: Install
        working-directory: studio-web
        run: npm ci

      # Next prerenders every page at build time, including 'use client'
      # ones, and lib/supabase.ts throws at import when the keys are absent —
      # deliberately, so a missing key never becomes a mystery 401 at runtime.
      # That guard fires in CI, where there are no keys and should not be any.
      #
      # These placeholders are not credentials and are not a way of smuggling
      # one in. Effects do not run during prerender, so nothing here ever
      # opens a connection; the values exist only to get past the import
      # guard so the build can typecheck and render. The URL uses .invalid,
      # the TLD RFC 2606 reserves as permanently unresolvable, so a mistake
      # that did try to reach the network could never land on a real host.
      #
      # A real deploy sets real keys and is unaffected: nothing here is
      # committed to the app, and a deploy that forgot them still fails at
      # import exactly as before.
      - name: Build
        working-directory: studio-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
        run: npm run build
